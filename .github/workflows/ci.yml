name: Rival verification

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: rival-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    env:
      OPENBLAS_NUM_THREADS: "1"
      OMP_NUM_THREADS: "1"
      PIP_DISABLE_PIP_VERSION_CHECK: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install package
        run: python -m pip install .
      - name: Compile Python
        run: python -m compileall -q rival tests
      - name: Run test suite
        run: python -m unittest discover -s tests -v
      - name: Verify prospective integrity
        run: python -m rival qualify-integrity --output reports/integrity_qualification.json
      - name: Reproduce real-data qualification
        run: python -m rival qualify-all --output-dir reports --compact
      - name: Build wheel
        run: python -m pip wheel . --no-deps --wheel-dir dist
      - name: Verify installed wheel outside checkout
        run: python scripts/verify_installed_wheel.py --wheel dist/rival_sim-0.6.0.dev7-py3-none-any.whl --output reports/installed_wheel.json
