name: Rival verification

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: rival-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install package
        run: python -m pip install .
      - name: Compile Python
        run: python -m compileall -q rival tests
      - name: Run test suite
        run: python -m unittest discover -s tests -v
      - name: Verify prospective integrity
        run: python -m rival qualify-integrity --output reports/integrity_qualification.json
      - name: Reproduce real-data qualification
        run: python -m rival qualify-all --output-dir reports --compact
      - name: Build wheel
        run: python -m pip wheel . --no-deps --no-build-isolation --wheel-dir dist
