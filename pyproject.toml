[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "rival-sim"
version = "0.6.0.dev1"
description = "Calibrated population and behavior simulation for enterprise decisions"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "numpy>=2.0",
  "pandas>=2.2",
  "pydantic>=2.6",
  "scikit-learn>=1.5",
  "scipy>=1.13",
  "cryptography>=42",
  "matplotlib>=3.9",
  "PyYAML>=6.0",
]

[project.optional-dependencies]
semantic = ["sentence-transformers>=3.0", "polars>=1.0"]
behavioral-local = ["transformers>=4.45", "torch>=2.4", "peft>=0.13"]
upstream-demand = ["cvxpy>=1.5", "tqdm>=4.66"]

[project.scripts]
rival = "rival.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["rival*"]

[tool.setuptools.package-data]
rival = [
  "static/*",
  "datasets/opinionqa/*",
  "datasets/twin2k/*",
  "qualification/*",
  "studies/twin2k_live_v1/*",
  "vendor/*/LICENSE",
]
